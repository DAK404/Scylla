<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scylla</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/showdown/dist/showdown.min.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            background-color: #2E2E2E;
            font-family: 'Chakra Petch', sans-serif;
            color: white;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #1C1C1C;
            border-bottom: 1px solid #ccc;
        }

        .header .branding-img {
            height: 40px;
            margin-right: 10px;
        }

        .header .user-info {
            display: flex;
            align-items: center;
        }

        .header .username {
            margin-right: 10px;
        }

        .header a {
            color: #4CAF50;
            text-decoration: none;
        }

        .chat-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            background-color: #3C3C3C;
        }

        .input-container {
            display: flex;
            flex-shrink: 0;
            padding: 10px;
            border-top: 1px solid #ccc;
            background-color: #3C3C3C;
        }

        textarea {
            width: 100%;
            height: 20px;
            resize: none;
            background-color: #2E2E2E;
            color: white;
            border: 1px solid #4CAF50;
            border-radius: 4px;
            padding: 10px;
        }

        button {
            margin-left: 10px;
            padding: 10px;
            background-color: #4CAF50;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }

        .chat-message {
            display: flex;
            margin: 10px 0;
        }

        .chat-message.ai {
            justify-content: flex-start;
        }

        .chat-message.user {
            justify-content: flex-end;
        }

        .bubble {
            padding: 10px 15px;
            border-radius: 20px;
            max-width: 60%;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .chat-message.ai .bubble {
            background-color: #2d2d2d;
            color: white;
            border-bottom-left-radius: 0;
        }

        .chat-message.user .bubble {
            background-color: #4CAF50;
            color: white;
            border-bottom-right-radius: 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="/static/branding.png" alt="Branding Image" class="branding-img">
        <div class="user-info">
            <span class="username">{{ username }}</span> |&nbsp;&nbsp;&nbsp;
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </div>

    <div class="chat-container" id="chat-container">
        <!-- Chat messages will appear here -->
    </div>

    <div class="input-container">
        <textarea id="user-input"></textarea>
        <button onclick="sendMessage()">Send</button>
        <button onclick="resetChat()">Reset</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const converter = new showdown.Converter();

            async function sendMessage() {
                const userInputField = document.getElementById('user-input');
                const userInput = userInputField.value.trim();
                const chatContainer = document.getElementById('chat-container');
                const username = document.querySelector('.username').textContent.trim();

                if (!userInput) return;
                userInputField.value = '';

                // Display user message
                const userMsgDiv = document.createElement('div');
                userMsgDiv.classList.add('chat-message', 'user');
                userMsgDiv.innerHTML = `<div class="bubble">${userInput}</div>`;
                chatContainer.appendChild(userMsgDiv);

                // Add "Thinking..." placeholder for AI
                const aiMsgDiv = document.createElement('div');
                aiMsgDiv.classList.add('chat-message', 'ai');
                const bubbleDiv = document.createElement('div');
                bubbleDiv.classList.add('bubble');
                bubbleDiv.innerHTML = "<em>Thinking...</em>";
                aiMsgDiv.appendChild(bubbleDiv);
                chatContainer.appendChild(aiMsgDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;

                try {
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: userInput })
                    });

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder('utf-8');
                    let fullText = "";

                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value, { stream: true });
                        fullText += chunk;

const cleaned = fullText.replace(/<think>.*?<\/think>/gs, '');

// Normalize spacing: ensure proper newlines for Markdown
const normalized = cleaned
  .replace(/\r\n/g, '\n')                     // Normalize Windows line endings
  .replace(/([0-9]+\.)\s*/g, '\n$1 ')         // Ensure numbered lists have newlines
  .replace(/\n{2,}/g, '\n\n');                // Avoid over-condensing paragraphs

const rendered = converter.makeHtml(normalized);
bubbleDiv.innerHTML = rendered;
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                } catch (error) {
                    bubbleDiv.innerHTML = `<strong>Error:</strong> ${error.message}`;
                    console.error('Streaming error:', error);
                }
            }

            function resetChat() {
                document.getElementById('user-input').value = '';
            }

            document.getElementById('user-input').addEventListener('keypress', function (event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    sendMessage();
                }
            });
        });
    </script>
</body>
</html>
